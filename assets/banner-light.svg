<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Ahmad Hussain, Senior Mobile Engineer</title>
  <desc id="d">Android (Kotlin, Java), Flutter and iOS apps for automotive and IoT products, with BLE, CAN and MQTT.</desc>
  <defs>
